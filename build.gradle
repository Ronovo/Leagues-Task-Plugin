plugins {
	id 'java'
}

group = 'com.leaguestasks'
version = '0.1.0'

// The Plugin Hub builds every submission against its own pinned client
// version; locally and in CI 'latest.release' compiles against whatever
// client you actually run. This is the value the Plugin Hub docs ask for.
def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.leaguestasks.LeaguesTasksPluginLauncher'

def lombokVersion = '1.18.34'

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly "org.projectlombok:lombok:${lombokVersion}"
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
	testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
	testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'junit', name: 'junit', version: '4.13.2'
	testImplementation group: 'org.mockito', name: 'mockito-core', version: '4.11.0'
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Launches a local RuneLite client with this plugin sideloaded, for
// development/testing. See src/test/java/.../*PluginLauncher.java.
def devClient = { JavaExec t ->
	t.classpath = sourceSets.test.runtimeClasspath
	t.mainClass = pluginMainClass
	t.jvmArgs '-ea'
	t.args '--developer-mode', '--debug'
}

tasks.register('run', JavaExec) { devClient(it) }

// Same client as `run`, plus Ronovo's Sync Tool compiled from its own folder
// (../Ronovos-Sync-Tool, or -PsyncToolDir=<path>). Without that folder it warns and
// starts Leagues Tasks alone.
def otherPluginDir = file(findProperty('syncToolDir') ?: '../Ronovos-Sync-Tool')
def otherPluginFound = new File(otherPluginDir, 'build.gradle').exists()

tasks.register('buildOtherPlugin', GradleBuild) {
	onlyIf { otherPluginFound }
	dir = otherPluginDir
	tasks = ['classes']
}

tasks.register('runWithSyncTool', JavaExec) {
	devClient(it)
	dependsOn 'buildOtherPlugin'
	classpath += files("$otherPluginDir/build/classes/java/main", "$otherPluginDir/build/resources/main")
	doFirst {
		if (otherPluginFound) {
			systemProperty 'extraPlugins', 'com.ronovosync.RonovosSyncPlugin'
		} else {
			logger.warn("Ronovo's Sync Tool not found at $otherPluginDir (set -PsyncToolDir=<path>); starting Leagues Tasks alone.")
		}
	}
}
